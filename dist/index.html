<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shazam — Interactive 3D Web Infographic</title>
    
    <!-- ES Module Import Map for Native Browser Execution & Vite Compatibility -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.174.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.174.0/examples/jsm/",
          "gsap": "https://unpkg.com/gsap@3.12.7/index.js"
        }
      }
    </script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }

      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030308;
        font-family: 'Outfit', sans-serif;
        color: #ffffff;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* 1. Start Screen Overlay (#startScreen) */
      #startScreen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, rgba(3, 3, 8, 0.4) 0%, rgba(3, 3, 8, 0.92) 100%);
        backdrop-filter: blur(4px);
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }

      #startScreen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .start-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        text-align: center;
      }

      .start-cta-btn {
        background: rgba(10, 20, 36, 0.85);
        border: 1px solid rgba(0, 229, 255, 0.5);
        color: #00e5ff;
        padding: 14px 42px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .start-cta-btn:hover {
        background: rgba(0, 229, 255, 0.2);
        border-color: #ffffff;
        color: #ffffff;
        box-shadow: 0 0 35px rgba(0, 229, 255, 0.6);
        transform: scale(1.05);
      }

      /* 2. World-Space HTML Anchors Overlay Layer (#anchors-layer) */
      #anchors-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }

      .node-anchor {
        position: absolute;
        top: 0;
        left: 0;
        transform: translate3d(0, 0, 0);
        will-change: transform, opacity;
        transition: opacity 0.4s ease;
      }

      .anchor-ring {
        position: absolute;
        top: -16px;
        left: -16px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid rgba(0, 229, 255, 0.3);
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        animation: pulseRing 3s infinite ease-in-out;
        pointer-events: none;
        transition: border-color 0.4s ease, box-shadow 0.4s ease;
      }

      .node-anchor.locked .anchor-ring {
        border-color: rgba(0, 150, 255, 0.15);
        box-shadow: none;
        animation: none;
      }

      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.3); opacity: 0.85; }
      }

      .anchor-label {
        position: absolute;
        left: 24px;
        top: -14px;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        background: rgba(5, 12, 24, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(0, 229, 255, 0.25);
        border-left: 3px solid #00e5ff;
        padding: 6px 14px;
        border-radius: 4px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(0.95) translateX(-6px);
      }

      .node-content-container {
        position: absolute;
        left: 24px;
        top: 30px;
        width: 360px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(12px);
      }

      .node-anchor.locked .anchor-label,
      .node-anchor.locked .node-content-container {
        opacity: 0;
        visibility: hidden;
        transform: scale(0.9) translateX(-10px);
        pointer-events: none;
      }

      .node-anchor.active .anchor-label {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        background: rgba(0, 229, 255, 0.15);
        border-color: #00ffff;
        border-left: 3px solid #ffffff;
        box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
        transform: scale(1.05) translateX(0px);
      }

      .node-anchor.active .node-content-container {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
      }

      .node-num {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 0.8rem;
        color: #00e5ff;
        letter-spacing: 0.05em;
      }

      .node-title {
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #e2e8f0;
      }

      /* 3. Conclusion CTA (#conclusionCTA) */
      #conclusionCTA {
        position: absolute;
        right: 32px;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        z-index: 25;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid #475569;
        background: rgba(15, 23, 42, 0.6);
        cursor: not-allowed;
        opacity: 0.5;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }

      /* Unlocked Cyan Active State for Conclusion CTA */
      #conclusionCTA.unlocked {
        border-color: #00e5ff;
        background: rgba(0, 229, 255, 0.15);
        cursor: pointer;
        opacity: 1;
        pointer-events: auto;
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        animation: pulseCTA 2.5s infinite ease-in-out;
      }

      #conclusionCTA.unlocked:hover {
        background: rgba(0, 229, 255, 0.35);
        border-color: #ffffff;
        box-shadow: 0 0 35px rgba(0, 229, 255, 0.8);
        transform: translateY(-50%) scale(1.15);
      }

      @keyframes pulseCTA {
        0%, 100% { box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        50% { box-shadow: 0 0 30px rgba(0, 229, 255, 0.8); }
      }

      .cta-inner-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #475569;
        transition: background-color 0.4s ease;
      }

      #conclusionCTA.unlocked .cta-inner-dot {
        background-color: #00e5ff;
        box-shadow: 0 0 10px #00e5ff;
      }

      /* 4. Conclusion Panel Container (#conclusionPanel) */
      #conclusionPanel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.95);
        width: 85%;
        max-width: 960px;
        height: 70%;
        max-height: 580px;
        background: rgba(5, 12, 24, 0.88);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 229, 255, 0.3);
        border-radius: 12px;
        z-index: 40;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 229, 255, 0.15);
        display: flex;
        flex-direction: column;
        padding: 32px;
      }

      #conclusionPanel.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translate(-50%, -50%) scale(1);
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      }

      .panel-close-btn {
        background: transparent;
        border: none;
        color: #94a3b8;
        font-size: 1.5rem;
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .panel-close-btn:hover {
        color: #00e5ff;
      }

      /* Content Anchor for Future HTML/CSS Content Overlay */
      #conclusionContentAnchor {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 24px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 1. Start Screen Overlay (#startScreen) -->
      <div id="startScreen">
        <div class="start-content">
          <button id="startCTA" class="start-cta-btn">COMENZAR</button>
        </div>
      </div>

      <!-- 2. World-Space HTML Anchors Overlay Layer (#anchors-layer) -->
      <div id="anchors-layer"></div>

      <!-- 3. Conclusion Right-Side Circular CTA (#conclusionCTA) -->
      <div id="conclusionCTA" class="disabled" title="Conclusión (Bloqueado hasta completar recorrido)">
        <div class="cta-inner-dot"></div>
      </div>

      <!-- 4. Conclusion Translucent Panel (#conclusionPanel) -->
      <div id="conclusionPanel">
        <div class="panel-header">
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; letter-spacing: 0.15em; color: #00e5ff; text-transform: uppercase;">
            CONCLUSIÓN DEL ESTUDIO
          </div>
          <button id="panelCloseBtn" class="panel-close-btn">&times;</button>
        </div>

        <!-- Structural Anchor for Future Content Overlay -->
        <div id="conclusionContentAnchor"></div>
      </div>
    </div>

    <!-- Application Script Entry Point -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
